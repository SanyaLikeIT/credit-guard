[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "creditguard"
version = "0.1.0"
description = "Reproducible credit risk modeling, calibration, and cost-sensitive evaluation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<1.10",
  "catboost>=1.2.9,<1.3",
  "shap>=0.49,<0.53",
  "matplotlib>=3.9,<4",
  "streamlit>=1.45,<2",
  "joblib>=1.4,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6.29,<8", "xlrd>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: lightweight synthetic end-to-end checks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
